<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>You're Invited — Margot &amp; Henry</title>
<meta name="description" content="Margot and Henry are getting married. Open your invitation.">
<meta property="og:title" content="You're invited — Margot &amp; Henry">
<meta property="og:description" content="The Fourth of October, Two Thousand Twenty-Six · Thistlewood Garden Conservatory">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%238A9A7E'/%3E%3Ctext x='16' y='21' font-size='14' text-anchor='middle' fill='%23F5F1E7' font-family='Georgia,serif'%3EMH%3C/text%3E%3C/svg%3E">
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,400;0,500;0,600;1,400&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Mrs+Saint+Delafield&display=swap');

:root{
  --linen:#F5F1E7;
  --linen-deep:#ECE4D0;
  --card:#FBF8F0;
  --ink:#33392F;
  --ink-soft:#5E6656;
  --sage:#8A9A7E;
  --sage-deep:#5F7052;
  --sage-pale:#C7D3BC;
  --rose:#C8A79A;
  --gold:#B69361;
  --serif-display:'Cormorant', serif;
  --serif-body:'EB Garamond', serif;
  --script:'Mrs Saint Delafield', cursive;
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  background:var(--linen);
  color:var(--ink);
  font-family:var(--serif-body);
  overflow-x:hidden;
  min-height:100vh;
}

.stage{position:fixed;inset:0;perspective:1800px;overflow:hidden;z-index:1;}

.stage-light{
  position:fixed;inset:0;z-index:10;
  background:radial-gradient(circle at 50% 42%, rgba(255,248,230,.55), transparent 55%);
  opacity:0;
  transition:opacity 1.3s ease .1s;
  pointer-events:none;
}
.stage.open .stage-light{opacity:1;}

.curtain-rod{position:fixed;top:0;left:0;right:0;height:12px;background:linear-gradient(180deg,#e9cd94,var(--gold));box-shadow:0 3px 12px rgba(0,0,0,.4);z-index:25;}

.tassel{
  position:fixed;top:0;left:50%;transform:translateX(-50%);
  width:26px;z-index:24;
  display:flex;flex-direction:column;align-items:center;
  transition:opacity .6s ease, transform .6s ease;
}
.tassel .cord{width:3px;height:42px;background:var(--gold);}
.tassel .knot{width:22px;height:22px;border-radius:50%;background:var(--gold);margin-top:-4px;box-shadow:0 4px 10px rgba(0,0,0,.3);}
.stage.open .tassel{opacity:0;transform:translateX(-50%) translateY(-40px) rotate(25deg);}

.curtain-panel{
  position:fixed;top:0;bottom:0;width:52%;
  z-index:20;
  background:
    repeating-linear-gradient(90deg, rgba(0,0,0,.12) 0 4px, transparent 4px 30px),
    linear-gradient(180deg, var(--sage) 0%, var(--sage-deep) 100%);
  box-shadow:inset 0 0 90px rgba(0,0,0,.4);
  cursor:pointer;
}
.curtain-left{left:-2%;transform-origin:left center;animation:idleSwayL 7s ease-in-out infinite;}
.curtain-right{right:-2%;transform-origin:right center;animation:idleSwayR 7s ease-in-out infinite;}
@keyframes idleSwayL{0%,100%{transform:rotateZ(.2deg);}50%{transform:rotateZ(-.2deg);}}
@keyframes idleSwayR{0%,100%{transform:rotateZ(-.2deg);}50%{transform:rotateZ(.2deg);}}

@keyframes curtainOpenLeft{
  0%{transform:translateX(0) rotateY(0deg) scaleX(1);}
  30%{transform:translateX(-6%) rotateY(-6deg) scaleX(1.08);}
  100%{transform:translateX(-108%) rotateY(-2deg) scaleX(1);}
}
@keyframes curtainOpenRight{
  0%{transform:translateX(0) rotateY(0deg) scaleX(1);}
  30%{transform:translateX(6%) rotateY(6deg) scaleX(1.08);}
  100%{transform:translateX(108%) rotateY(2deg) scaleX(1);}
}
.stage.open .curtain-left{animation:curtainOpenLeft 1.3s cubic-bezier(.65,0,.35,1) forwards;}
.stage.open .curtain-right{animation:curtainOpenRight 1.3s cubic-bezier(.65,0,.35,1) forwards;}

.pre-open{
  position:fixed;inset:0;z-index:30;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:24px;
  transition:opacity .5s ease, transform .5s ease;
}
.stage.open .pre-open{opacity:0;transform:scale(.94);pointer-events:none;}

.pre-open .eyebrow{
  font-family:var(--serif-display);
  font-variant:small-caps;
  letter-spacing:.24em;
  font-size:14px;
  color:var(--linen);
  opacity:.9;
  margin:0 0 18px;
}
.pre-open .invite-names{
  font-family:var(--script);
  font-size:clamp(44px,10vw,72px);
  color:var(--linen);
  margin:0 0 16px;
  line-height:1;
}
.pre-open .guest-line{
  font-family:var(--serif-display);
  font-style:italic;
  font-size:18px;
  color:var(--linen);
  opacity:.9;
  margin:0 0 8px;
}

.open-btn{
  margin-top:30px;
  background:transparent;
  border:1px solid var(--linen);
  color:var(--linen);
  font-family:var(--serif-display);
  font-variant:small-caps;
  letter-spacing:.18em;
  font-size:15px;
  padding:14px 36px;
  cursor:pointer;
  position:relative;
  transition:background .3s ease, color .3s ease;
}
.open-btn:hover{background:var(--linen);color:var(--sage-deep);}
.open-btn::after{
  content:"";
  position:absolute;inset:-7px;
  border:1px solid var(--linen);
  opacity:.55;
  pointer-events:none;
  animation:pulseRing 2.6s ease-out infinite;
}
@keyframes pulseRing{0%{transform:scale(1);opacity:.55;}100%{transform:scale(1.2);opacity:0;}}

.invite-card-wrap{
  position:fixed;inset:0;z-index:15;
  display:flex;align-items:center;justify-content:center;
  padding:24px;
  opacity:0;
  transform:translateY(28px) scale(.96);
  transition:opacity 1s ease .35s, transform 1s cubic-bezier(.2,.8,.2,1) .35s;
  pointer-events:none;
}
.stage.open .invite-card-wrap{opacity:1;transform:translateY(0) scale(1);pointer-events:auto;}

.invite-card{
  background:var(--card);
  border:1px solid rgba(51,57,47,.15);
  box-shadow:0 26px 64px rgba(51,57,47,.35);
  padding:52px 44px 42px;
  max-width:440px;width:100%;
  text-align:center;
}
.invite-card .eyebrow{
  font-family:var(--serif-display);
  font-variant:small-caps;
  letter-spacing:.2em;
  font-size:13px;
  color:var(--sage-deep);
  margin:0 0 10px;
}
.invite-card .script-names{
  font-family:var(--script);
  font-size:clamp(36px,7vw,50px);
  color:var(--sage-deep);
  margin:2px 0 16px;
  line-height:1;
}
.invite-card .invite-date{
  font-family:var(--serif-display);
  font-size:16px;
  letter-spacing:.06em;
  margin:0 0 4px;
}
.invite-card .invite-venue{
  font-size:14px;
  color:var(--ink-soft);
  margin:0 0 26px;
}
.cta-btn{
  display:inline-block;
  background:var(--sage-deep);
  color:var(--linen);
  font-family:var(--serif-display);
  font-variant:small-caps;
  letter-spacing:.12em;
  font-size:15px;
  text-decoration:none;
  padding:13px 32px;
  transition:background .25s ease, transform .2s ease;
}
.cta-btn:hover{background:#4a5940;}
.cta-btn:active{transform:scale(.98);}

.petal-ambient{position:fixed;inset:0;z-index:12;pointer-events:none;overflow:hidden;}
.amb-petal{
  position:absolute;top:-20px;width:10px;height:10px;
  border-radius:50% 0 50% 50%;
  opacity:0;
  animation:petalDrift var(--dur,8s) linear forwards;
}
@keyframes petalDrift{
  0%{transform:translate(0,0) rotate(0deg);opacity:0;}
  8%{opacity:.85;}
  92%{opacity:.85;}
  100%{transform:translate(var(--drift,0),112vh) rotate(var(--rot,180deg));opacity:0;}
}

@media (prefers-reduced-motion:reduce){
  .curtain-left,.curtain-right{animation:none !important;}
  .stage.open .curtain-left{animation:none !important;transform:translateX(-108%);}
  .stage.open .curtain-right{animation:none !important;transform:translateX(108%);}
  .open-btn::after{display:none;}
  .pre-open,.invite-card-wrap,.stage-light,.tassel{transition:none !important;}
}
</style>
</head>
<body>

<div class="stage" id="stage">
  <div class="stage-light" aria-hidden="true"></div>

  <div class="curtain-panel curtain-left" id="curtainLeft"></div>
  <div class="curtain-panel curtain-right" id="curtainRight"></div>
  <div class="curtain-rod"></div>
  <div class="tassel" aria-hidden="true"><div class="cord"></div><div class="knot"></div></div>

  <div class="pre-open">
    <p class="eyebrow">You are invited to celebrate</p>
    <h1 class="invite-names">Margot &amp; Henry</h1>
    <p class="guest-line" id="guestLine">You are joyfully invited</p>
    <button class="open-btn" id="openBtn">Tap to open your invitation</button>
  </div>

  <div class="invite-card-wrap">
    <div class="invite-card">
      <p class="eyebrow">Together with their families</p>
      <p class="script-names">Margot &amp; Henry</p>
      <p class="invite-date">The Fourth of October, Two Thousand Twenty-Six</p>
      <p class="invite-venue">Thistlewood Garden Conservatory</p>
      <a class="cta-btn" href="index.html" id="detailsLink">View wedding details</a>
    </div>
  </div>
</div>

<div class="petal-ambient" id="petalAmbient" aria-hidden="true"></div>

<script>
const stage = document.getElementById('stage');
const openBtn = document.getElementById('openBtn');
const guestLine = document.getElementById('guestLine');
const detailsLink = document.getElementById('detailsLink');
const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

const params = new URLSearchParams(window.location.search);
const guest = params.get('to');
if(guest){
  guestLine.textContent = 'You are joyfully invited, ' + guest;
  document.title = "You're invited, " + guest + ' — Margot & Henry';
  detailsLink.href = 'index.html?to=' + encodeURIComponent(guest);
}

let opened = false;
function openInvitation(){
  if(opened) return;
  opened = true;
  stage.classList.add('open');
  if(!reducedMotion) startPetals();
}
openBtn.addEventListener('click', openInvitation);
document.getElementById('curtainLeft').addEventListener('click', openInvitation);
document.getElementById('curtainRight').addEventListener('click', openInvitation);

function startPetals(){
  const field = document.getElementById('petalAmbient');
  const colors = ['var(--sage)','var(--rose)','var(--gold)','var(--sage-pale)'];
  let count = 0;
  const max = 36;
  const timer = setInterval(()=>{
    if(count >= max){ clearInterval(timer); return; }
    count++;
    const p = document.createElement('div');
    p.className = 'amb-petal';
    p.style.left = (Math.random()*100)+'vw';
    p.style.background = colors[count % colors.length];
    p.style.setProperty('--dur', (6+Math.random()*5).toFixed(2)+'s');
    p.style.setProperty('--drift', (Math.random()*160-80)+'px');
    p.style.setProperty('--rot', (Math.random()*360)+'deg');
    field.appendChild(p);
    p.addEventListener('animationend', ()=> p.remove());
  }, 650);
}
</script>

</body>
</html>
